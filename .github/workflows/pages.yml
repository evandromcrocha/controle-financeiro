name: Publicar web no GitHub Pages
on:
  push:
    branches: [main, claude/financial-control-app-samd74]
    paths: ['web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Marca a versão publicada
        run: |
          echo "$GITHUB_SHA" > web/version.txt
          sed -i "s/__BUILD__/$GITHUB_SHA/" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
