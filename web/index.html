<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Controle Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="build" content="__BUILD__">
<meta name="theme-color" content="#8a5a3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=__BUILD__">
<script>
// escolhe o tema antes de pintar, para não piscar o claro (a troca depois fica em js/tema.js)
(function(){let t=null;try{t=localStorage.getItem('cf-theme');}catch{}
  document.documentElement.setAttribute('data-theme',t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));})();
</script>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="brandmark"><svg class="ico" style="width:28px;height:28px" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></div>
    <h1>Controle Financeiro</h1>
    <div class="sub">Entre para acessar suas contas e cartões</div>
    <label>E-mail</label><input id="email" type="email" placeholder="voce@email.com" autocomplete="username" />
    <label>Senha</label><input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    <button class="btn" style="width:100%;margin-top:20px" id="btnLogin">Entrar</button>
    <div id="loginErr" style="color:var(--red);margin-top:12px;text-align:center;font-size:14px"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><span class="m"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span> Financeiro</div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox" id="userBox" title="Usuário conectado"></div>
    <div class="foot">
      <button class="iconbtn" id="btnTheme" title="Tema" aria-label="Alternar tema"></button>
      <button class="btn ghost" style="flex:1" id="btnLogout"><svg class="ico sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Sair</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="titlerow"><h1 id="title">Resumo</h1><span class="userchip" id="userChip" title="Usuário conectado"></span></div>
      <div class="toolbar">
        <div class="ymsel" id="compWrap">
          <button class="iconbtn" id="compPrev" title="Mês anterior" aria-label="Mês anterior">‹</button>
          <div class="selectwrap"><select id="mesSel" aria-label="Mês"></select><svg class="ico sm chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="selectwrap"><select id="anoSel" aria-label="Ano"></select><svg class="ico sm chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <button class="iconbtn" id="compNext" title="Próximo mês" aria-label="Próximo mês">›</button>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script type="module" src="js/main.js?v=__BUILD__"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
<script>
// atualiza sozinho quando há versão nova publicada (evita ficar preso no cache do navegador/iPhone)
(function(){const atual=document.querySelector('meta[name=build]').content;if(atual==='__BUILD__')return;
  let checando=false;
  async function checar(){if(checando)return;checando=true;
    try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(r.ok){const v=(await r.text()).trim();
      if(v&&v!==atual&&!document.querySelector('.modal-bg')){location.reload();}}}catch{}checando=false;}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checar();});
  setInterval(checar,5*60*1000);checar();})();
</script>
</body>
</html>
