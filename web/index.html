<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Controle Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#8a5a3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --surface-2:#fbfbfd; --elev:#ffffff;
    --border:#eceef3; --border-strong:#dfe2e9;
    --text:#0f172a; --text-2:#475569; --muted:#8a93a6;
    --primary:#4f46e5; --primary-weak:#eef0fe; --primary-strong:#4338ca;
    --green:#059669; --green-weak:#e4f6ef; --red:#dc2626; --red-weak:#fdeaea;
    --amber:#d97706; --amber-weak:#fdf0e1; --info:#2563eb;
    --shadow:0 1px 2px rgba(16,19,34,.04),0 4px 16px -8px rgba(16,19,34,.08);
    --shadow-lg:0 12px 40px -12px rgba(16,19,34,.25);
    --r-lg:18px; --r-md:13px; --r-sm:9px;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0f172a; --surface:#141d33; --surface-2:#101a34; --elev:#17213c;
    --border:#24304a; --border-strong:#2f3d5c;
    --text:#ffffff; --text-2:#c1cadb; --muted:#7e8aa3;
    --primary:#3b82f6; --primary-weak:#101e3a; --primary-strong:#60a5fa;
    --green:#10b981; --green-weak:#0d2a20; --red:#f04455; --red-weak:#2c1519;
    --amber:#f5b23d; --amber-weak:#2a2213; --info:#3b82f6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 20px 50px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f172a; --surface:#141d33; --surface-2:#101a34; --elev:#17213c;
      --border:#24304a; --border-strong:#2f3d5c;
      --text:#ffffff; --text-2:#c1cadb; --muted:#7e8aa3;
      --primary:#3b82f6; --primary-weak:#101e3a; --primary-strong:#60a5fa;
      --green:#10b981; --green-weak:#0d2a20; --red:#f04455; --red-weak:#2c1519;
      --amber:#f5b23d; --amber-weak:#2a2213; --info:#3b82f6;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
      --shadow-lg:0 20px 50px -18px rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--primary-weak)}
  .hidden{display:none!important}
  svg{display:block}
  .ico{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ico.sm{width:16px;height:16px}
  .muted{color:var(--muted)}
  button{font-family:inherit}
  input,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:11px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:var(--muted)}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
  label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin:14px 0 6px}
  a{color:var(--primary)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:var(--r-md);padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s;min-height:44px}
  .btn:hover{background:var(--primary-strong)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-weak)}
  .btn.ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border-strong)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn.red{background:var(--red)} .btn.red:hover{filter:brightness(.95)}
  .btn.sm{padding:8px 13px;min-height:38px;font-size:13px}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);cursor:pointer;transition:.15s}
  .iconbtn:hover{color:var(--text);background:var(--surface-2)}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 600px at 80% -10%,var(--primary-weak),transparent 60%)}
  .loginbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow-lg)}
  .brandmark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 16px;box-shadow:0 8px 20px -6px var(--primary)}
  .loginbox h1{font-size:22px;text-align:center;margin:0 0 2px}
  .loginbox .sub{text-align:center;color:var(--muted);margin-bottom:8px}

  /* ---------- SHELL ---------- */
  #app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--border);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:11px;font-weight:650;font-size:16px;margin-bottom:26px;padding:0 6px}
  .brand .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;border:none;background:none;color:var(--text-2);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;text-align:left}
  .nav button:hover{background:var(--surface-2);color:var(--text)}
  .nav button.active{background:var(--primary-weak);color:var(--primary)}
  .nav button.active .ico{stroke:var(--primary)}
  .side .foot{margin-top:auto;display:flex;gap:8px}
  .main{padding:26px 34px;max-width:1180px;width:100%}
  @media(max-width:920px){#app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.side .foot{margin:0 0 0 auto}.main{padding:20px}}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .topbar h1{font-size:26px;font-weight:650;margin:0;letter-spacing:-.02em}
  .toolbar{display:flex;gap:10px;align-items:center}
  .selectwrap{position:relative}
  .selectwrap select{padding-right:34px;font-weight:600;min-height:44px;cursor:pointer;width:auto}
  .selectwrap .chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
  h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:26px 0 12px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}

  /* KPI */
  .stat{flex:1;min-width:210px;display:flex;flex-direction:column;gap:10px}
  .stat .top{display:flex;align-items:center;justify-content:space-between}
  .stat .chip{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .stat .lbl{font-size:13px;color:var(--muted);font-weight:600}
  .stat .val{font-size:27px;font-weight:650;letter-spacing:-.02em}

  /* list rows */
  .lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
  .lrow:first-child{border-top:none}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .bar{height:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* table */
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th,td{text-align:left;padding:13px 12px;font-size:14px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--surface)}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--surface-2)}
  th.amt{text-align:right}
  td.amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .chiptag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}

  /* segmented + pills */
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px}
  .seg button{border:none;background:none;color:var(--muted);padding:8px 15px;font-weight:700;font-size:13px;border-radius:9px;cursor:pointer;transition:.15s;min-height:38px}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .seg button.on.amber{color:var(--amber)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .15s}
  @keyframes fade{from{opacity:0}}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:470px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
  .modal h3{margin:0 0 4px;font-size:19px}
  .modal.wide{max-width:820px}
  .clickrow{cursor:pointer;border-radius:10px;padding:6px 8px;margin:0 -8px 7px;transition:background .12s}
  .clickrow:hover{background:var(--surface-2)}
  th.sort{cursor:pointer;user-select:none;white-space:nowrap}
  th.sort:hover{color:var(--text)}
  th.sort .arr{display:inline-block;width:12px;margin-left:4px;color:var(--primary)}

  /* import banner */
  .import{width:100%;border:none;border-radius:var(--r-lg);padding:18px;display:flex;align-items:center;gap:15px;color:#fff;text-align:left;cursor:pointer;
    background:linear-gradient(120deg,var(--primary),#3b82f6 90%);box-shadow:0 10px 30px -12px var(--primary);transition:transform .12s}
  .import:hover{transform:translateY(-1px)}
  .import .ic-wrap{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}

  .pend-banner{display:flex;align-items:center;gap:11px;background:var(--amber-weak);border:1px solid var(--amber);border-radius:var(--r-md);padding:13px 15px;color:var(--text);margin-bottom:16px}
  .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:14px 18px;z-index:90;max-width:380px;box-shadow:var(--shadow-lg);animation:slidein .25s}
  @keyframes slidein{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* ---------- dashboard ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:560px){.kpis{grid-template-columns:1fr}}
  .kpi{border:none;text-align:left;cursor:default;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
  .kpi.click{cursor:pointer}.kpi.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .kpi .lbl{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:space-between}
  .kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;align-self:flex-start}
  .kpi .hint{font-size:12px;color:var(--muted)}
  .chip{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .card h2{font-size:15px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:600}
  .grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  @media(max-width:920px){.grid3{grid-template-columns:1fr}}
  .ymsel{display:flex;gap:8px}

  /* ========== GLASS (inspirado no "Glassy Dashboard") ========== */
  :root{--glass:rgba(255,255,255,.55);--glass-2:rgba(255,255,255,.38);--glass-bd:rgba(255,255,255,.7);--blur:saturate(160%) blur(22px);
    --bgimg:radial-gradient(900px 600px at 10% 0%,#f3dcc4 0%,transparent 60%),radial-gradient(800px 600px at 100% 20%,#d9c2ad 0%,transparent 55%),radial-gradient(900px 700px at 50% 110%,#c9b6a6 0%,transparent 60%),linear-gradient(160deg,#efe6dc,#e2d6ca);
    --primary:#8a5a3b;--primary-strong:#6f452b;--primary-weak:rgba(138,90,59,.12);--surface-2:rgba(255,255,255,.35);--border:rgba(120,90,60,.12);--border-strong:rgba(120,90,60,.2)}
  :root[data-theme="dark"]{--glass:rgba(30,26,24,.5);--glass-2:rgba(40,34,30,.35);--glass-bd:rgba(255,255,255,.09);
    --bgimg:radial-gradient(900px 600px at 10% 0%,#4a3426 0%,transparent 60%),radial-gradient(800px 600px at 100% 20%,#2c3a44 0%,transparent 55%),radial-gradient(900px 700px at 50% 110%,#3a2a22 0%,transparent 60%),linear-gradient(160deg,#17130f,#0f0d0c);
    --primary:#e0a370;--primary-strong:#f0b888;--primary-weak:rgba(224,163,112,.14);--surface:#201b18;--surface-2:rgba(255,255,255,.05);--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.12)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(30,26,24,.5);--glass-2:rgba(40,34,30,.35);--glass-bd:rgba(255,255,255,.09);
    --bgimg:radial-gradient(900px 600px at 10% 0%,#4a3426 0%,transparent 60%),radial-gradient(800px 600px at 100% 20%,#2c3a44 0%,transparent 55%),linear-gradient(160deg,#17130f,#0f0d0c);
    --primary:#e0a370;--primary-strong:#f0b888;--primary-weak:rgba(224,163,112,.14);--surface:#201b18;--surface-2:rgba(255,255,255,.05);--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.12)}}
  body{background:var(--bgimg);background-attachment:fixed;min-height:100vh}
  .card,.loginbox,.modal,.toast{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-bd);box-shadow:0 8px 32px -12px rgba(60,40,20,.25)}
  .card{border-radius:22px}
  .kpi.click:hover{transform:translateY(-4px)}
  th{background:transparent;backdrop-filter:var(--blur)}
  tbody tr:hover,.clickrow:hover{background:var(--glass-2)}
  input,select{background:var(--glass-2);border-color:var(--glass-bd)}
  .iconbtn,.btn.ghost{background:var(--glass-2);border-color:var(--glass-bd)}
  .seg{background:var(--glass-2);border-color:var(--glass-bd)} .seg button.on{background:var(--glass)}
  #login{background:none}
  select{appearance:none;-webkit-appearance:none}
  @media(max-width:560px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .val{font-size:19px}.kpi .hint,.kpi .delta{font-size:11px}}
  .brandmark,.brand .m{background:linear-gradient(135deg,#c08457,#8a5a3b)}
  .import{background:linear-gradient(120deg,#a8704a,#d49a6a)}
  /* menu lateral flutuante */
  #app{grid-template-columns:240px 1fr;gap:0}
  .side{margin:16px;height:calc(100vh - 32px);top:16px;border-radius:24px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-bd)}
  .nav button.active{background:var(--glass);box-shadow:0 2px 10px -4px rgba(60,40,20,.3)}
  .main{padding:28px 30px 28px 14px}
  .topbar{position:sticky;top:12px;z-index:20;padding:10px 12px 10px 20px;border-radius:20px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-bd)}
  .topbar h1{font-size:22px}
  /* celular: barra inferior em pílula, como no modelo */
  @media(max-width:920px){
    #app{grid-template-columns:1fr}
    .side{position:fixed;top:auto;bottom:14px;left:50%;transform:translateX(-50%);height:auto;margin:0;padding:6px;border-radius:999px;z-index:50;width:auto;max-width:calc(100vw - 24px)}
    .side{flex-wrap:nowrap}.side .brand{display:none}.side .foot{margin:0 0 0 2px;gap:4px}.side .foot .btn{font-size:0;gap:0;padding:0 11px;min-height:40px;border-radius:999px}.side .foot .iconbtn{border-radius:999px}
    .nav{flex-direction:row;flex-wrap:nowrap;gap:2px}
    .nav button{flex-direction:column;gap:2px;padding:8px 12px;font-size:10px;border-radius:999px}
    .main{padding:14px 16px 110px}
    .topbar{top:8px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="brandmark"><svg class="ico" style="width:28px;height:28px" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></div>
    <h1>Controle Financeiro</h1>
    <div class="sub">Entre para acessar suas contas e cartões</div>
    <label>E-mail</label><input id="email" type="email" placeholder="voce@email.com" autocomplete="username" />
    <label>Senha</label><input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    <button class="btn" style="width:100%;margin-top:20px" id="btnLogin">Entrar</button>
    <div id="loginErr" style="color:var(--red);margin-top:12px;text-align:center;font-size:14px"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><span class="m"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span> Financeiro</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="iconbtn" id="btnTheme" title="Tema" aria-label="Alternar tema"></button>
      <button class="btn ghost" style="flex:1" id="btnLogout"><svg class="ico sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Sair</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="title">Resumo</h1>
      <div class="toolbar">
        <div class="ymsel" id="compWrap">
          <button class="iconbtn" id="compPrev" title="Mês anterior" aria-label="Mês anterior">‹</button>
          <div class="selectwrap"><select id="mesSel" aria-label="Mês"></select><svg class="ico sm chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="selectwrap"><select id="anoSel" aria-label="Ano"></select><svg class="ico sm chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <button class="iconbtn" id="compNext" title="Próximo mês" aria-label="Próximo mês">›</button>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

async function fetchAllLancamentos(){const P=1000;let f=0,all=[];for(;;){const{data,error}=await supabase.from('lancamentos').select('*').order('competencia_ref',{ascending:false}).range(f,f+P-1);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<P)break;f+=P;}return all;}
async function loadAll(){
  const[rows,b,c,d,u]=await Promise.all([fetchAllLancamentos(),supabase.from('categorias').select('id,nome').order('nome'),supabase.from('formas_pagamento').select('id,nome,tipo,dia_vencimento').order('nome'),supabase.from('orcamentos').select('id,categoria,valor'),supabase.auth.getUser()]);
  state.rows=rows||[];state.cats=b.data||[];state.formas=c.data||[];state.orc=(d.data||[]);state.saldoIni=+(u.data?.user?.user_metadata?.saldo_inicial||0);
  state.comps=[...new Set(state.rows.map(r=>r.competencia).filter(Boolean))];
  // abre no mês atual; se não houver dados nele, no mês com dados mais próximo
  if(!state.comps.includes(state.comp)){
    const alvo=nowComp(), ord=c=>{const[m,y]=c.split('/');return +y*12+ +m;};
    state.comp = state.comps.length
      ? state.comps.reduce((a,b)=>Math.abs(ord(b)-ord(alvo))<Math.abs(ord(a)-ord(alvo))?b:a)
      : state.comp;
  }
  fillComp();render();
}
function fillComp(){
  const[m,y]=state.comp.split('/');

  const ms=$('#mesSel'),as=$('#anoSel');ms.innerHTML='';as.innerHTML='';
  MESES.forEach((n,i)=>{const v=String(i+1).padStart(2,'0');ms.append(el('option',{value:v,...(v===m?{selected:'1'}:{})},n));});
  anos.forEach(a=>as.append(el('option',{value:a,...(a===y?{selected:'1'}:{})},a)));
  const set=()=>{state.comp=ms.value+'/'+as.value;render();};
  ms.onchange=set;as.onchange=set;
  const step=d=>{let[mm,yy]=state.comp.split('/').map(Number);mm+=d;if(mm<1){mm=12;yy--;}if(mm>12){mm=1;yy++;}state.comp=String(mm).padStart(2,'0')+'/'+yy;fillComp();render();};

}

// donut svg
function donut(data,total){
  const size=170,rad=68,cx=size/2,cy=size/2,circ=2*Math.PI*rad;let off=0;
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${size} ${size}`);s.setAttribute('width',size);s.setAttribute('height',size);
  const bg=document.createElementNS(NS,'circle');bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',rad);bg.setAttribute('fill','none');bg.setAttribute('stroke','var(--surface-2)');bg.setAttribute('stroke-width','16');s.append(bg);
  data.forEach(([n,val])=>{const frac=total?val/total:0;const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',rad);c.setAttribute('fill','none');c.setAttribute('stroke',colorFor(n));c.setAttribute('stroke-width','16');
    c.setAttribute('stroke-dasharray',`${circ*frac} ${circ}`);c.setAttribute('stroke-dashoffset',-off*circ);c.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);c.setAttribute('stroke-linecap','butt');s.append(c);off+=frac;});
  const t1=document.createElementNS(NS,'text');t1.setAttribute('x',cx);t1.setAttribute('y',cy-2);t1.setAttribute('text-anchor','middle');t1.setAttribute('fill','var(--muted)');t1.setAttribute('font-size','11');t1.textContent='Total gasto';s.append(t1);
  const t2=document.createElementNS(NS,'text');t2.setAttribute('x',cx);t2.setAttribute('y',cy+16);t2.setAttribute('text-anchor','middle');t2.setAttribute('fill','var(--text)');t2.setAttribute('font-size','16');t2.setAttribute('font-weight','800');t2.textContent=brl(total).replace('R$','R$ ');s.append(t2);
  return s;
}

const ordC=c=>{const[m,y]=c.split('/');return +y*12+ +m;};
const shiftComp=(c,d)=>{const n=ordC(c)+d-1;return String(n%12+1).padStart(2,'0')+'/'+Math.floor(n/12);};
const totaisMes=c=>{let e=0,sa=0;state.rows.forEach(r=>{if(r.competencia!==c)return;r.tipo==='CRÉDITO'?e+=Math.abs(r.valor):sa+=Math.abs(r.valor);});return{e,sa};};
const saldoAte=c=>{const lim=ordC(c);let t=state.saldoIni||0;state.rows.forEach(r=>{if(r.competencia&&ordC(r.competencia)<=lim)t+=r.tipo==='CRÉDITO'?Math.abs(r.valor):-Math.abs(r.valor);});return t;};

function sparkArea(vals,labels,clickIdx){
  const W=640,H=180,P=24,n=vals.length;const mx=Math.max(...vals,0),mn=Math.min(...vals,0),rg=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/Math.max(1,n-1),y=v=>P+(mx-v)/rg*(H-2*P);
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${W} ${H+18}`);s.setAttribute('width','100%');
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.append(e);return e;};
  const g=mk('defs',{});g.innerHTML='<linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".25"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient>';
  mk('line',{x1:P,x2:W-P,y1:y(0),y2:y(0),stroke:'var(--border-strong)','stroke-dasharray':'4 4'});
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  mk('polygon',{points:`${x(0)},${y(mn)} ${pts} ${x(n-1)},${y(mn)}`,fill:'url(#ga)'});
  mk('polyline',{points:pts,fill:'none',stroke:'var(--primary)','stroke-width':2.5,'stroke-linejoin':'round'});
  vals.forEach((v,i)=>{const c=mk('circle',{cx:x(i),cy:y(v),r:i===clickIdx?5:3.5,fill:i===clickIdx?'var(--primary)':'var(--surface)',stroke:'var(--primary)','stroke-width':2});
    const t=document.createElementNS(NS,'title');t.textContent=labels[i]+': '+brl(v);c.append(t);
    mk('text',{x:x(i),y:H+12,'text-anchor':'middle','font-size':11,fill:'var(--muted)'}).textContent=labels[i];});
  return s;
}

// ---------- ordenação de tabelas ----------
const SORTS={
  data:r=>r.data_transacao||r.data_pagamento||'',
  descricao:r=>(r.descricao||'').toLowerCase(),
  categoria:r=>(r.categoria||'').toLowerCase(),
  forma_pagamento:r=>(r.forma_pagamento||'').toLowerCase(),
  parcela:r=>r.parcelas_total>1?(r.parcela_num||0)/r.parcelas_total:-1,
  data_pagamento:r=>r.data_pagamento||'',
  valor:r=>Math.abs(+r.valor),
};
function ordenar(list,sort){
  if(!sort||!SORTS[sort.key])return list;
  const f=SORTS[sort.key],d=sort.dir==='asc'?1:-1;
  return[...list].sort((a,b)=>{const x=f(a),y=f(b);return x<y?-d:x>y?d:0;});
}
function sortHeader(cols,sort,onSort){
  return el('thead',{},el('tr',{},...cols.map(([k,lb,cls])=>{
    const on=sort&&sort.key===k;
    return el('th',{class:'sort'+(cls?' '+cls:''),title:'Ordenar',onclick:()=>onSort(k)},
      lb,el('span',{class:'arr'},on?(sort.dir==='asc'?'▲':'▼'):''));
  })));
}
function toggleSort(sort,k){
  if(sort.key===k)sort.dir=sort.dir==='asc'?'desc':'asc';else{sort.key=k;sort.dir=k==='valor'?'desc':'asc';}
}

function importarFatura(){const cartoes=state.formas.filter(f=>f.tipo==='CARTAO');if(!cartoes.length)return toast('Cadastre um cartão primeiro.');
  modal(close=>{const box=el('div');box.append(el('h3',{},'Importar fatura (PDF)'),el('div',{class:'muted',style:'margin:4px 0 6px'},'A IA lê o PDF e adiciona só o que falta.'));

    box.append(el('label',{},'Arquivo PDF'));const file=el('input',{type:'file',accept:'application/pdf'});box.append(file);
    const status=el('div',{class:'muted',style:'margin-top:12px'});
    const btn=el('button',{class:'btn',style:'width:100%;margin-top:16px',onclick:async()=>{if(!file.files[0])return toast('Selecione o PDF.');
      btn.disabled=true;btn.innerHTML='';btn.append(el('span',{class:'spin'}),document.createTextNode(' Lendo a fatura...'));status.textContent='Extraindo e interpretando com IA...';
      try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file.files[0]);});
        const{data,error}=await supabase.functions.invoke('importar-fatura',{body:{pdfBase64:b64,cartao:sel.value}});
        if(error)throw error;if(!data?.ok)throw new Error(data?.erro||'Falha.');
        close();toast(`✅ ${compLabel(data.competencia)}: ${data.inseridos} novo(s), ${data.auto_categorizados||0} auto-categorizado(s), ${data.pendentes||0} pendente(s).`);await loadAll();
      }catch(e){status.style.color='var(--red)';status.textContent=e.message||String(e);btn.disabled=false;btn.textContent='Tentar novamente';}
    }},'Importar');
    box.append(btn,status);return box;});}
