<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fbfbfd; --elev:#ffffff;
    --border:#e7e9ee; --border-strong:#d7dae2;
    --text:#0f172a; --text-2:#475569; --muted:#8a93a6;
    --primary:#1e40af; --primary-weak:#e6ecfb; --primary-strong:#16358f;
    --green:#059669; --green-weak:#e4f6ef; --red:#dc2626; --red-weak:#fdeaea;
    --amber:#d97706; --amber-weak:#fdf0e1; --info:#2563eb;
    --shadow:0 1px 2px rgba(16,19,34,.06),0 8px 24px -12px rgba(16,19,34,.14);
    --shadow-lg:0 12px 40px -12px rgba(16,19,34,.25);
    --r-lg:18px; --r-md:13px; --r-sm:9px;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0f172a; --surface:#141d33; --surface-2:#101a34; --elev:#17213c;
    --border:#24304a; --border-strong:#2f3d5c;
    --text:#ffffff; --text-2:#c1cadb; --muted:#7e8aa3;
    --primary:#3b82f6; --primary-weak:#101e3a; --primary-strong:#60a5fa;
    --green:#10b981; --green-weak:#0d2a20; --red:#f04455; --red-weak:#2c1519;
    --amber:#f5b23d; --amber-weak:#2a2213; --info:#3b82f6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 20px 50px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f172a; --surface:#141d33; --surface-2:#101a34; --elev:#17213c;
      --border:#24304a; --border-strong:#2f3d5c;
      --text:#ffffff; --text-2:#c1cadb; --muted:#7e8aa3;
      --primary:#3b82f6; --primary-weak:#101e3a; --primary-strong:#60a5fa;
      --green:#10b981; --green-weak:#0d2a20; --red:#f04455; --red-weak:#2c1519;
      --amber:#f5b23d; --amber-weak:#2a2213; --info:#3b82f6;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
      --shadow-lg:0 20px 50px -18px rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--primary-weak)}
  .hidden{display:none!important}
  svg{display:block}
  .ico{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ico.sm{width:16px;height:16px}
  .muted{color:var(--muted)}
  button{font-family:inherit}
  input,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:11px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:var(--muted)}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
  label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin:14px 0 6px}
  a{color:var(--primary)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:var(--r-md);padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s;min-height:44px}
  .btn:hover{background:var(--primary-strong)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-weak)}
  .btn.ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border-strong)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn.red{background:var(--red)} .btn.red:hover{filter:brightness(.95)}
  .btn.sm{padding:8px 13px;min-height:38px;font-size:13px}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);cursor:pointer;transition:.15s}
  .iconbtn:hover{color:var(--text);background:var(--surface-2)}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 600px at 80% -10%,var(--primary-weak),transparent 60%)}
  .loginbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow-lg)}
  .brandmark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 16px;box-shadow:0 8px 20px -6px var(--primary)}
  .loginbox h1{font-size:22px;text-align:center;margin:0 0 2px}
  .loginbox .sub{text-align:center;color:var(--muted);margin-bottom:8px}

  /* ---------- SHELL ---------- */
  #app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--border);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16px;margin-bottom:26px;padding:0 6px}
  .brand .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;border:none;background:none;color:var(--text-2);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;text-align:left}
  .nav button:hover{background:var(--surface-2);color:var(--text)}
  .nav button.active{background:var(--primary-weak);color:var(--primary)}
  .nav button.active .ico{stroke:var(--primary)}
  .side .foot{margin-top:auto;display:flex;gap:8px}
  .main{padding:26px 34px;max-width:1180px;width:100%}
  @media(max-width:920px){#app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.side .foot{margin:0 0 0 auto}.main{padding:20px}}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .topbar h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
  .toolbar{display:flex;gap:10px;align-items:center}
  .selectwrap{position:relative}
  .selectwrap select{padding-right:34px;font-weight:600;min-height:44px;cursor:pointer;width:auto}
  .selectwrap .chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
  h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:26px 0 12px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}

  /* KPI */
  .stat{flex:1;min-width:210px;display:flex;flex-direction:column;gap:10px}
  .stat .top{display:flex;align-items:center;justify-content:space-between}
  .stat .chip{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .stat .lbl{font-size:13px;color:var(--muted);font-weight:600}
  .stat .val{font-size:27px;font-weight:800;letter-spacing:-.02em}

  /* list rows */
  .lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
  .lrow:first-child{border-top:none}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .bar{height:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* table */
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th,td{text-align:left;padding:13px 12px;font-size:14px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--surface)}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--surface-2)}
  td.amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .chiptag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}

  /* segmented + pills */
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px}
  .seg button{border:none;background:none;color:var(--muted);padding:8px 15px;font-weight:700;font-size:13px;border-radius:9px;cursor:pointer;transition:.15s;min-height:38px}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .seg button.on.amber{color:var(--amber)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .15s}
  @keyframes fade{from{opacity:0}}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:470px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
  .modal h3{margin:0 0 4px;font-size:19px}

  /* import banner */
  .import{width:100%;border:none;border-radius:var(--r-lg);padding:18px;display:flex;align-items:center;gap:15px;color:#fff;text-align:left;cursor:pointer;
    background:linear-gradient(120deg,var(--primary),#3b82f6 90%);box-shadow:0 10px 30px -12px var(--primary);transition:transform .12s}
  .import:hover{transform:translateY(-1px)}
  .import .ic-wrap{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}

  .pend-banner{display:flex;align-items:center;gap:11px;background:var(--amber-weak);border:1px solid var(--amber);border-radius:var(--r-md);padding:13px 15px;color:var(--text);margin-bottom:16px}
  .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:14px 18px;z-index:90;max-width:380px;box-shadow:var(--shadow-lg);animation:slidein .25s}
  @keyframes slidein{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="brandmark"><svg class="ico" style="width:28px;height:28px" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></div>
    <h1>Controle Financeiro</h1>
    <div class="sub">Entre para acessar suas contas e cartões</div>
    <label>E-mail</label><input id="email" type="email" placeholder="voce@email.com" autocomplete="username" />
    <label>Senha</label><input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    <button class="btn" style="width:100%;margin-top:20px" id="btnLogin">Entrar</button>
    <div id="loginErr" style="color:var(--red);margin-top:12px;text-align:center;font-size:14px"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><span class="m"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span> Financeiro</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button class="iconbtn" id="btnTheme" title="Tema" aria-label="Alternar tema"></button>
      <button class="btn ghost" style="flex:1" id="btnLogout"><svg class="ico sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Sair</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="title">Resumo</h1>
      <div class="toolbar">
        <div class="selectwrap" id="compWrap">
          <select id="compSel"></select>
          <svg class="ico sm chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://fjlphewbocclfwzwlymy.supabase.co';
const SUPABASE_KEY='sb_publishable_Sbs85eyq_D4oKbJ4-LDE6g_aWV-KE3S';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'financeiro'}});

const $=s=>document.querySelector(s);
const el=(t,p={},...ch)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(p)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!=null)e.setAttribute(k,v);}for(const c of ch.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;};
const NS='http://www.w3.org/2000/svg';
const ICON={home:['M3 11l9-8 9 8','M5 21V11h14v10'],list:['M8 6h13','M8 12h13','M8 18h13','M3 6h.01','M3 12h.01','M3 18h.01'],chart:['M3 3v18h18','M18 9l-5 5-3-3-4 4'],gear:['M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z','M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z'],plus:['M12 5v14','M5 12h14'],search:['M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z','M21 21l-4.3-4.3'],doc:['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z','M14 2v6h6'],sparkle:['M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z'],trash:['M3 6h18','M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6','M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'],up:['M12 19V5','M5 12l7-7 7 7'],down:['M12 5v14','M5 12l7 7 7-7'],moon:['M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z'],sun:['M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z','M12 1v2','M12 21v2','M4.2 4.2l1.4 1.4','M18.4 18.4l1.4 1.4','M1 12h2','M21 12h2','M4.2 19.8l1.4-1.4','M18.4 5.6l1.4-1.4'],wallet:['M21 12V7H5a2 2 0 0 1 0-4h14v4','M3 5v14a2 2 0 0 0 2 2h16v-5','M18 12a2 2 0 0 0 0 4h4v-4z'],tag:['M20.6 13.4L12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z','M7 7h.01']};
function icon(name,cls='ico'){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class',cls);(ICON[name]||[]).forEach(d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);s.append(p);});return s;}

const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const compLabel=c=>{if(!c||!c.includes('/'))return c||'—';const[m,y]=c.split('/');return `${MESES[+m-1]||m} ${y}`;};
const compRef=c=>{const[m,y]=c.split('/');return `${y}-${m.padStart(2,'0')}-01`;};
const nowComp=()=>{const d=new Date();return `${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;};
const PAL=['#2563eb','#059669','#f04438','#d97706','#0ea5e9','#7c3aed','#0891b2','#db2777','#ca8a04','#4f46e5','#15803d','#e11d48'];
const colorFor=k=>{k=k||'';let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return PAL[h%PAL.length];};
function toast(msg){const t=el('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),200);},4000);}

// theme
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('cf-theme',t);
  $('#btnTheme').innerHTML='';$('#btnTheme').append(icon(t==='dark'?'sun':'moon','ico sm'));}
$('#btnTheme').onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
applyTheme(localStorage.getItem('cf-theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

// nav
const NAVS=[['resumo','home','Resumo'],['lanc','list','Lançamentos'],['rel','chart','Relatórios'],['ajustes','gear','Ajustes']];
let state={comp:nowComp(),rows:[],cats:[],formas:[],comps:[],tab:'resumo'};
function buildNav(){const n=$('#nav');n.innerHTML='';NAVS.forEach(([t,ic,lb])=>{const b=el('button',{class:state.tab===t?'active':'',onclick:()=>{state.tab=t;$('#title').textContent=lb;$('#compWrap').style.display=(t==='resumo'||t==='lanc')?'':'none';buildNav();render();}},icon(ic),lb);n.append(b);});}

async function fetchAllLancamentos(){const P=1000;let f=0,all=[];for(;;){const{data,error}=await supabase.from('lancamentos').select('*').order('competencia_ref',{ascending:false}).range(f,f+P-1);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<P)break;f+=P;}return all;}
async function loadAll(){
  const[rows,b,c]=await Promise.all([fetchAllLancamentos(),supabase.from('categorias').select('id,nome').order('nome'),supabase.from('formas_pagamento').select('id,nome,tipo,dia_vencimento').order('nome')]);
  state.rows=rows||[];state.cats=b.data||[];state.formas=c.data||[];
  state.comps=[...new Set(state.rows.map(r=>r.competencia).filter(Boolean))];
  if(!state.comps.includes(state.comp))state.comp=state.comps[0]||state.comp;
  fillComp();render();
}
function fillComp(){const sel=$('#compSel');sel.innerHTML='';(state.comps.includes(state.comp)?state.comps:[state.comp,...state.comps]).forEach(c=>sel.append(el('option',{value:c,...(c===state.comp?{selected:'1'}:{})},compLabel(c))));sel.onchange=()=>{state.comp=sel.value;render();};}
const doMes=()=>state.rows.filter(r=>r.competencia===state.comp);
const isPend=r=>!r.categoria;
const agrupa=(list,key,tipo='DÉBITO')=>{const m=new Map();list.forEach(r=>{if(r.tipo!==tipo)return;const k=r[key]||'Outros';m.set(k,(m.get(k)||0)+Math.abs(r.valor));});return[...m.entries()].sort((a,b)=>b[1]-a[1]);};

function render(){const v=$('#view');v.innerHTML='';({resumo:renderResumo,lanc:renderLanc,rel:renderRel,ajustes:renderAjustes}[state.tab])(v);}

// donut svg
function donut(data,total){
  const size=170,rad=68,cx=size/2,cy=size/2,circ=2*Math.PI*rad;let off=0;
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${size} ${size}`);s.setAttribute('width',size);s.setAttribute('height',size);
  const bg=document.createElementNS(NS,'circle');bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',rad);bg.setAttribute('fill','none');bg.setAttribute('stroke','var(--surface-2)');bg.setAttribute('stroke-width','16');s.append(bg);
  data.forEach(([n,val])=>{const frac=total?val/total:0;const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',rad);c.setAttribute('fill','none');c.setAttribute('stroke',colorFor(n));c.setAttribute('stroke-width','16');
    c.setAttribute('stroke-dasharray',`${circ*frac} ${circ}`);c.setAttribute('stroke-dashoffset',-off*circ);c.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);c.setAttribute('stroke-linecap','butt');s.append(c);off+=frac;});
  const t1=document.createElementNS(NS,'text');t1.setAttribute('x',cx);t1.setAttribute('y',cy-2);t1.setAttribute('text-anchor','middle');t1.setAttribute('fill','var(--muted)');t1.setAttribute('font-size','11');t1.textContent='Total gasto';s.append(t1);
  const t2=document.createElementNS(NS,'text');t2.setAttribute('x',cx);t2.setAttribute('y',cy+16);t2.setAttribute('text-anchor','middle');t2.setAttribute('fill','var(--text)');t2.setAttribute('font-size','16');t2.setAttribute('font-weight','800');t2.textContent=brl(total).replace('R$','R$ ');s.append(t2);
  return s;
}

function renderResumo(v){

  if(pend)v.append(el('div',{class:'pend-banner'},icon('sparkle','ico sm'),el('span',{},`${pend} lançamento(s) para categorizar — abra Lançamentos › Pendentes.`)));
  const kpis=el('div',{class:'row'});
  const mk=(lb,val,col,bg,ic)=>el('div',{class:'card stat'},
    el('div',{class:'top'},el('span',{class:'lbl'},lb),el('span',{class:'chip',style:`background:${bg};color:${col}`},icon(ic,'ico sm'))),
    el('div',{class:'val',style:`color:${col}`},brl(val)));
  kpis.append(
    mk('Saldo do mês',e-sa,(e-sa)>=0?'var(--green)':'var(--red)','var(--primary-weak)','wallet'),
    mk('Entradas',e,'var(--green)','var(--green-weak)','down'),
    mk('Saídas',sa,'var(--red)','var(--red-weak)','up'));
  v.append(kpis);

  // categorias donut
  const pc=agrupa(dm,'categoria');const tot=pc.reduce((s,[,x])=>s+x,0);const top=pc.slice(0,6);
  const c1=el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Distribuição por categoria'));
  const inner=el('div',{style:'display:flex;gap:20px;align-items:center;flex-wrap:wrap'});

  top.forEach(([n,val])=>leg.append(el('div',{class:'lrow'},el('span',{class:'dot',style:`background:${colorFor(n)}`}),el('span',{style:'flex:1'},n),el('b',{style:'font-variant-numeric:tabular-nums'},brl(val)))));
  inner.append(leg);c1.append(inner);
  // por cartão

  const c2=el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Gastos por cartão / conta'));
  pf.forEach(([n,val])=>{const w=el('div',{style:'margin-bottom:13px'});
    w.append(el('div',{style:'display:flex;justify-content:space-between;margin-bottom:6px'},el('span',{style:'font-weight:600'},n),el('span',{class:'muted',style:'font-variant-numeric:tabular-nums'},brl(val))));
    w.append(el('div',{class:'bar'},el('span',{style:`width:${val/mxf*100}%;background:${colorFor(n)}`})));c2.append(w);});
  if(!pf.length)c2.append(el('div',{class:'muted'},'Sem gastos.'));
  g.append(c1,c2);v.append(g);

function renderLanc(v){
  let filtro='todos',q='';
  const bar=el('div',{style:'display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap'});
  const sw=el('div',{style:'position:relative;flex:1;min-width:200px;max-width:320px'});
  const inp=el('input',{placeholder:'Buscar lançamento...',style:'padding-left:38px',oninput:e=>{q=e.target.value;draw();}});
  sw.append(inp,el('span',{style:'position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)'},icon('search','ico sm')));
  const seg=el('div',{class:'seg'});const bseg={};
  const bt=(k,l)=>el('button',{class:filtro===k?('on'+(k==='pendentes'?' amber':'')):'',onclick:()=>{filtro=k;Object.entries(bseg).forEach(([kk,b])=>b.className=kk===k?('on'+(kk==='pendentes'?' amber':'')):'');draw();}},l);
  bseg.todos=bt('todos','Todos');bseg.pendentes=bt('pendentes','Pendentes');seg.append(bseg.todos,bseg.pendentes);
  const add=el('button',{class:'btn',style:'margin-left:auto',onclick:()=>openLanc()},icon('plus','ico sm'),'Novo');
  bar.append(sw,seg,add);v.append(bar);
  const wrap=el('div',{class:'card',style:'padding:6px 6px'});v.append(wrap);
  function draw(){
    let list=doMes();if(filtro==='pendentes')list=list.filter(isPend);
    if(q.trim())list=list.filter(r=>(r.descricao+r.categoria+r.forma_pagamento).toLowerCase().includes(q.toLowerCase()));
    const pc=doMes().filter(isPend).length;bseg.pendentes.textContent='Pendentes'+(pc?` (${pc})`:'');
    wrap.innerHTML='';const tw=el('div',{class:'tablewrap'});const t=el('table');
    t.append(el('thead',{},el('tr',{},...['Descrição','Categoria','Cartão/Conta','Venc.','Valor'].map((h,i)=>el('th',{class:i===4?'amt':''},h)))));
    const tb=el('tbody');
    if(!list.length)tb.append(el('tr',{},el('td',{colspan:5,class:'muted',style:'text-align:center;padding:34px'},filtro==='pendentes'?'Nada pendente 🎉':'Nenhum lançamento.')));
    list.forEach(r=>{const cred=r.tipo==='CRÉDITO';const pend=isPend(r);
      const av=el('span',{class:'avatar',style:`background:${(pend?'var(--amber)':colorFor(r.categoria))}1f;color:${pend?'var(--amber)':colorFor(r.categoria)}`},icon(pend?'sparkle':'tag','ico sm'));
      const catCell=pend?el('span',{class:'chiptag',style:'background:var(--amber-weak);color:var(--amber)'},'Pendente')
        :el('span',{class:'chiptag',style:`background:${colorFor(r.categoria)}1f;color:${colorFor(r.categoria)}`},r.categoria);
      tb.append(el('tr',{onclick:()=>openLanc(r)},
        el('td',{},el('div',{style:'display:flex;align-items:center;gap:11px'},av,el('div',{},el('div',{style:'font-weight:600'},r.descricao),r.parcelas_total>1?el('div',{class:'muted',style:'font-size:12px'},`${r.parcelas_total}x`):null))),
        el('td',{},catCell),
        el('td',{class:'muted'},r.forma_pagamento||'—'),
        el('td',{class:'muted'},r.data_pagamento?r.data_pagamento.split('-').reverse().join('/'):'—'),
        el('td',{class:'amt',style:`color:${cred?'var(--green)':'var(--red)'}`},(cred?'+ ':'- ')+brl(Math.abs(r.valor)).replace('R$','').trim())));});
    t.append(tb);tw.append(t);wrap.append(tw);
  }
  draw();
}

function renderRel(v){
  const rows=state.rows;const pc=agrupa(rows,'categoria');const tot=pc.reduce((s,[,x])=>s+x,0);
  const mm=new Map();rows.forEach(r=>{const k=r.competencia_ref||'0';const cur=mm.get(k)||{comp:r.competencia,e:0,sa:0};r.tipo==='CRÉDITO'?cur.e+=Math.abs(r.valor):cur.sa+=Math.abs(r.valor);mm.set(k,cur);});
  const meses=[...mm.entries()].sort((a,b)=>a[0]<b[0]?1:-1).slice(0,12).map(x=>x[1]).reverse();const mx=Math.max(1,...meses.map(m=>Math.max(m.e,m.sa)));
  // grouped column chart
  const c1=el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Evolução mensal'));
  const chart=el('div',{style:'display:flex;gap:10px;align-items:flex-end;height:200px;overflow-x:auto;padding-top:10px'});
  meses.forEach(m=>{const col=el('div',{style:'flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:7px'});
    const bars=el('div',{style:'display:flex;gap:4px;align-items:flex-end;height:150px'});
    bars.append(el('div',{title:'Entradas '+brl(m.e),style:`width:13px;height:${Math.max(2,m.e/mx*150)}px;background:var(--green);border-radius:5px 5px 0 0`}),
      el('div',{title:'Saídas '+brl(m.sa),style:`width:13px;height:${Math.max(2,m.sa/mx*150)}px;background:var(--red);border-radius:5px 5px 0 0`}));
    col.append(bars,el('span',{class:'muted',style:'font-size:11px'},(m.comp||'').split('/')[0]+'/'+(m.comp||'').split('/')[1]?.slice(2)));chart.append(col);});
  c1.append(chart,el('div',{style:'display:flex;gap:16px;margin-top:12px;font-size:12px'},
    el('span',{class:'muted'},el('span',{style:'display:inline-block;width:10px;height:10px;background:var(--green);border-radius:3px;margin-right:5px'}),'Entradas'),
    el('span',{class:'muted'},el('span',{style:'display:inline-block;width:10px;height:10px;background:var(--red);border-radius:3px;margin-right:5px'}),'Saídas')));
  v.append(c1);
  const c2=el('div',{class:'card',style:'margin-top:16px'},el('h2',{style:'margin-top:0'},'Gastos por categoria (todo período) · '+brl(tot)));
  pc.forEach(([n,val])=>{const p=tot?val/tot*100:0;const w=el('div',{style:'margin-bottom:12px'});
    w.append(el('div',{style:'display:flex;justify-content:space-between;margin-bottom:6px'},el('span',{style:'display:flex;align-items:center;gap:8px'},el('span',{class:'dot',style:`background:${colorFor(n)}`}),n),el('span',{class:'muted'},brl(val)+' · '+p.toFixed(1)+'%')));
    w.append(el('div',{class:'bar'},el('span',{style:`width:${p}%;background:${colorFor(n)}`})));c2.append(w);});
  v.append(c2);
}

function modal(node){const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}});const m=el('div',{class:'modal'});m.append(node(()=>bg.remove()));bg.append(m);document.body.append(bg);
  document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){bg.remove();document.removeEventListener('keydown',esc);}});return bg;}

function openLanc(r={}){modal(close=>{const box=el('div');box.append(el('h3',{},r.id?'Editar lançamento':'Novo lançamento'));
  const f={tipo:r.tipo||'DÉBITO',valor:r.valor!=null?String(r.valor):'',descricao:r.descricao||'',categoria:r.categoria||'',forma_pagamento:r.forma_pagamento||'',competencia:r.competencia||state.comp,parcelas_total:r.parcelas_total||1,data_pagamento:r.data_pagamento||''};
  const seg=el('div',{class:'seg',style:'width:100%;margin-top:14px'});
  const opt=[['DÉBITO','Saída','var(--red)'],['CRÉDITO','Entrada','var(--green)']];
  opt.forEach(([k,l,c])=>seg.append(el('button',{style:'flex:1'+(f.tipo===k?`;background:${c};color:#fff`:''),class:f.tipo===k?'on':'',onclick:e=>{f.tipo=k;[...seg.children].forEach((x,i)=>{const on=opt[i][0]===f.tipo;x.className=on?'on':'';x.style.cssText='flex:1'+(on?`;background:${opt[i][2]};color:#fff`:'');});}},l)));
  box.append(seg);
  const add=(lab,node)=>{box.append(el('label',{},lab),node);return node;};
  add('Descrição',el('input',{value:f.descricao,oninput:e=>f.descricao=e.target.value,placeholder:'Ex: Mercado'}));
  add('Valor (R$)',el('input',{type:'number',step:'0.01',value:f.valor,oninput:e=>f.valor=e.target.value,placeholder:'0,00'}));
  const cat=add('Categoria',el('select',{onchange:e=>f.categoria=e.target.value}));cat.append(el('option',{value:''},'— sem categoria —'));state.cats.forEach(c=>cat.append(el('option',{value:c.nome,...(c.nome===f.categoria?{selected:1}:{})},c.nome)));
  const fp=add('Forma de pagamento',el('select',{onchange:e=>f.forma_pagamento=e.target.value}));fp.append(el('option',{value:''},'—'));state.formas.forEach(x=>fp.append(el('option',{value:x.nome,...(x.nome===f.forma_pagamento?{selected:1}:{})},x.nome)));
  const g=el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:10px'});
  const comp=el('input',{value:f.competencia,placeholder:'MM/AAAA',oninput:e=>f.competencia=e.target.value});
  const venc=el('input',{value:f.data_pagamento,placeholder:'AAAA-MM-DD',oninput:e=>f.data_pagamento=e.target.value});
  g.append(el('div',{},el('label',{},'Competência'),comp),el('div',{},el('label',{},'Vencimento'),venc));box.append(g);
  const acts=el('div',{style:'display:flex;gap:10px;margin-top:22px'});
  acts.append(el('button',{class:'btn',style:'flex:1',onclick:async()=>{const v=Math.abs(parseFloat(String(f.valor).replace(',','.'))||0);
    if(!f.descricao.trim())return toast('Informe a descrição.');if(!v)return toast('Informe o valor.');if(!/^\d{2}\/\d{4}$/.test(f.competencia))return toast('Competência MM/AAAA.');
    const payload={descricao:f.descricao.trim(),valor:v,tipo:f.tipo,valor_final:f.tipo==='CRÉDITO'?v:-v,categoria:f.categoria||null,forma_pagamento:f.forma_pagamento||null,parcelas_total:+f.parcelas_total||1,competencia:f.competencia,competencia_ref:compRef(f.competencia),data_pagamento:/^\d{4}-\d{2}-\d{2}$/.test(f.data_pagamento)?f.data_pagamento:null};
    const{error}=await(r.id?supabase.from('lancamentos').update(payload).eq('id',r.id):supabase.from('lancamentos').insert(payload));if(error)return toast(error.message);close();await loadAll();}},'Salvar'));
  if(r.id)acts.append(el('button',{class:'btn red',onclick:async()=>{if(confirm('Excluir?')){await supabase.from('lancamentos').delete().eq('id',r.id);close();await loadAll();}}},icon('trash','ico sm')));
  box.append(acts);return box;});}

function openCard(r={}){modal(close=>{const box=el('div');box.append(el('h3',{},r.id?'Editar cartão/conta':'Novo cartão/conta'));
  const f={nome:r.nome||'',tipo:r.tipo||'CARTAO',dia_vencimento:r.dia_vencimento||''};
  box.append(el('label',{},'Nome'));const nome=el('input',{value:f.nome,oninput:e=>f.nome=e.target.value,placeholder:'Ex: Nubank'});box.append(nome);
  box.append(el('label',{},'Tipo'));const ts=el('select',{onchange:e=>f.tipo=e.target.value});['CARTAO','CONTA','DINHEIRO'].forEach(t=>ts.append(el('option',{value:t,...(t===f.tipo?{selected:1}:{})},t==='CARTAO'?'Cartão':t==='CONTA'?'Conta':'Dinheiro')));box.append(ts);
  box.append(el('label',{},'Dia de vencimento (cartão)'));const dv=el('input',{type:'number',value:f.dia_vencimento,oninput:e=>f.dia_vencimento=e.target.value});box.append(dv);
  const acts=el('div',{style:'display:flex;gap:10px;margin-top:22px'});
  acts.append(el('button',{class:'btn',style:'flex:1',onclick:async()=>{if(!f.nome.trim())return toast('Informe o nome.');const payload={nome:f.nome.trim(),tipo:f.tipo,dia_vencimento:f.dia_vencimento?+f.dia_vencimento:null};const{error}=await(r.id?supabase.from('formas_pagamento').update(payload).eq('id',r.id):supabase.from('formas_pagamento').insert(payload));if(error)return toast(error.message);close();await loadAll();}},'Salvar'));
  if(r.id)acts.append(el('button',{class:'btn red',onclick:async()=>{if(confirm('Remover?')){await supabase.from('formas_pagamento').delete().eq('id',r.id);close();await loadAll();}}},icon('trash','ico sm')));
  box.append(acts);return box;});}

function importarFatura(){const cartoes=state.formas.filter(f=>f.tipo==='CARTAO');if(!cartoes.length)return toast('Cadastre um cartão primeiro.');
  modal(close=>{const box=el('div');box.append(el('h3',{},'Importar fatura (PDF)'),el('div',{class:'muted',style:'margin:4px 0 6px'},'A IA lê o PDF e adiciona só o que falta.'));
    box.append(el('label',{},'Cartão'));const sel=el('select');cartoes.forEach(f=>sel.append(el('option',{value:f.nome},f.nome)));box.append(sel);
    box.append(el('label',{},'Arquivo PDF'));const file=el('input',{type:'file',accept:'application/pdf'});box.append(file);
    const status=el('div',{class:'muted',style:'margin-top:12px'});
    const btn=el('button',{class:'btn',style:'width:100%;margin-top:16px',onclick:async()=>{if(!file.files[0])return toast('Selecione o PDF.');
      btn.disabled=true;btn.innerHTML='';btn.append(el('span',{class:'spin'}),document.createTextNode(' Lendo a fatura...'));status.textContent='Extraindo e interpretando com IA...';
      try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file.files[0]);});
        const{data,error}=await supabase.functions.invoke('importar-fatura',{body:{pdfBase64:b64,cartao:sel.value}});
        if(error)throw error;if(!data?.ok)throw new Error(data?.erro||'Falha.');
        close();toast(`✅ ${compLabel(data.competencia)}: ${data.inseridos} novo(s), ${data.auto_categorizados||0} auto-categorizado(s), ${data.pendentes||0} pendente(s).`);await loadAll();
      }catch(e){status.style.color='var(--red)';status.textContent=e.message||String(e);btn.disabled=false;btn.textContent='Tentar novamente';}
    }},'Importar');
    box.append(btn,status);return box;});}
